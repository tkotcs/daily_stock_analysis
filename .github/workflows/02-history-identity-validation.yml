name: Manual free history and identity validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1-free-market-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install original dependencies
        run: python -m pip install -r requirements.txt
      - name: Read-only history diagnostic; no CLI analysis or credentials
        env:
          PYTHONIOENCODING: utf-8
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: python .github/scripts/history_identity_validation.py --out history-evidence
      - name: Preserve successes and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase1b-history-${{ github.run_id }}
          path: history-evidence/
          retention-days: 7
