name: Manual prefill and native CLI acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1-free-market-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Original dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2
      - name: Offline conversion regressions (no credentials)
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: python -m pytest -q tests/test_yfinance_class_shares.py tests/test_yfinance_us_indices.py tests/test_yfinance_hk_bare_code.py tests/test_yfinance_hk_indices.py tests/test_yfinance_jp_kr_indices.py tests/test_yfinance_normalize.py tests/test_prefill_ma60_acceptance.py --junitxml=offline-regression.xml
      - name: Original API prefill and original dry-run; stop trend probes before AI
        env:
          PYTHONIOENCODING: utf-8
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: python .github/scripts/prefill_cli_validation.py --out prefill-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase1c-prefill-${{ github.run_id }}
          path: |
            prefill-evidence/
            offline-regression.xml
          retention-days: 7
