name: Manual free NVDA final request capture
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nvda-final-free-capture
  cancel-in-progress: false
jobs:
  prepare-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      CUSTOM_TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 578fc55364bf32b7299e84eea7a630eb7e93e973
          path: upstream-fixed
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Full dependencies and public tokenizer asset
        run: |
          python -m pip install -r upstream-fixed/requirements.txt pytest
          python -m pip check
          mkdir -p acceptance
          python -m pip freeze > acceptance/dependencies.txt
          python controller/.github/scripts/prepare_offline_assets.py --cache "$TIKTOKEN_CACHE_DIR" > acceptance/tokenizer-assets.json
      - name: Offline one-POST, redaction and native compatibility tests
        run: |
          python controller/.github/scripts/phase2g_offline_tests.py 2>&1 | tee acceptance/offline-tests.log
          python controller/.github/scripts/phase2g_upstream_regression.py 2>&1 | tee acceptance/upstream-tests.log
      - name: Current NVDA data and native request intercepted before POST
        run: python controller/.github/scripts/nvda_free_preflight.py --source upstream-fixed --out acceptance/nvda-inputs --include-free-research
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase2h-request-${{ github.run_id }}
          path: acceptance/
          retention-days: 30
          if-no-files-found: error