name: Manual DSA research and free preflight
run-name: ${{ inputs.execute_live && 'Authorized frozen manual research batch' || 'FREE manual preflight' }}
on:
  workflow_dispatch:
    inputs:
      comparison_modes:
        description: "Frozen three-symbol paired Flash modes; default FREE"
        type: boolean
        default: false
      execute_live:
        type: boolean
        default: false
      mvp_universe:
        description: 'Manual watchlist scope'
        type: choice
        options: [three, watchlist35, single_mode_watchlist]
        default: three
      mvp_three:
        description: 'Select native MVP; paid mode still requires a new frozen batch and user approval'
        type: boolean
        default: false
      allow_peak_test:
        description: 'Explicit Phase2U test-only peak-rate permission; no production scheduling'
        type: boolean
        default: false
      request_sha256:
        type: string
        required: true
      analysis_asof:
        type: string
        required: true
      target_session:
        type: string
        required: true
      pricing_sha256:
        type: string
        required: true
      authorization_reference:
        type: string
        required: true
      secret_upload_approval_reference:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: nvda-manual-preflight
  cancel-in-progress: false
jobs:
  single_mode_watchlist:
    if: ${{ inputs.mvp_universe == 'single_mode_watchlist' && inputs.mvp_three && !inputs.comparison_modes && github.actor == github.repository_owner && github.ref == 'refs/heads/deploy/phase2h-request-preparation' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/05-manual-watchlist-mode.yml
    with:
      mode: nonthinking
      bundle_path: .github/frozen/manual-watchlist-approved-bf7c3b89
      batch_sha256: ${{ inputs.request_sha256 }}
      authorization_reference: ${{ inputs.authorization_reference }}
      secret_upload_approval_reference: ${{ inputs.secret_upload_approval_reference }}
      execute_live: ${{ inputs.execute_live }}
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  preflight:
    if: ${{ !inputs.comparison_modes && (!inputs.execute_live && !inputs.mvp_three && inputs.request_sha256 != 'FREE_REMOTE_CLAIM_TEST' && github.actor == github.repository_owner && github.ref == 'refs/heads/deploy/phase2h-request-preparation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      CUSTOM_TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: preparation
      - uses: actions/checkout@v5
        with:
          ref: 9e94ecc305e724a7c436c62e7e501e64c359991e
          persist-credentials: false
          path: controller
      - uses: actions/checkout@v5
        with:
          ref: a1daaa302b3a72fb5694c9872ceecf2c4dc0b6e4
          persist-credentials: false
          path: upstream-fixed
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Dependencies and public tokenizer (no paid keys)
        run: |
          python -m pip install -r upstream-fixed/requirements.txt litellm==1.98.1 httpx==0.28.1 openai==2.54.0 tiktoken==0.11.0 pandas==3.0.6 pytest
          python -m pip check
          python controller/.github/scripts/prepare_offline_assets.py --cache "$TIKTOKEN_CACHE_DIR"
      - name: Three isolated startup regressions only, fake transports
        env:
          REQUEST_SHA: ${{ inputs.request_sha256 }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$REQUEST_SHA" = 08b09a31d1d08c4b1fa33bc92f850feb63709ace5c6f8fd43a63aa9bee82cdee
          python controller/.github/scripts/test_startup_process.py --source upstream-fixed --out startup-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: free-startup-fix-${{ github.run_id }}
          path: |
            startup-evidence/
          retention-days: 14
  claim_test:
    if: ${{ !inputs.comparison_modes && (!inputs.execute_live && !inputs.mvp_three && inputs.request_sha256 == 'FREE_REMOTE_CLAIM_TEST' && github.actor == github.repository_owner && github.ref == 'refs/heads/deploy/phase2h-request-preparation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Only guard dependency, no model credentials
        run: python -m pip install httpx==0.28.1
      - name: Isolated process and failure regressions, no paid network
        run: python .github/scripts/test_remote_execution_claim.py 2>&1 | tee claim-tests.log
      - name: Actual atomic GitHub claim race, test namespace only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/test_remote_execution_claim.py --github-smoke claim-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: free-remote-claim-${{ github.run_id }}
          path: |
            claim-tests.log
            claim-evidence/
          retention-days: 14
  mvp:
    if: ${{ inputs.mvp_universe != 'single_mode_watchlist' && !inputs.comparison_modes && (!inputs.execute_live && inputs.mvp_three && github.actor == github.repository_owner && github.ref == 'refs/heads/deploy/phase2h-request-preparation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      CUSTOM_TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: preparation
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 68b85e7a143be95f5f7d4bea66989c37f777877a
          path: upstream-fixed
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Native dependencies and public tokenizer, no paid credentials
        run: |
          python -m pip install -r upstream-fixed/requirements.txt litellm==1.98.1 httpx==0.28.1 openai==2.54.0 tiktoken==0.11.0 pandas==3.0.6 markdown2
          python preparation/.github/scripts/prepare_offline_assets.py --cache "$TIKTOKEN_CACHE_DIR"
      - name: Independent native pipelines, fresh free data and fake model only
        env:
          MVP_UNIVERSE: ${{ inputs.mvp_universe }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C upstream-fixed rev-parse HEAD)" = 68b85e7a143be95f5f7d4bea66989c37f777877a
          python preparation/.github/scripts/mvp_three.py --source upstream-fixed --out mvp-output --universe "$MVP_UNIVERSE" --research-data preparation/.github/research/official-three-20261017.json
      - name: Freeze fresh manual candidates only, no authorization or POST
        if: always()
        env:
          MVP_UNIVERSE: ${{ inputs.mvp_universe }}
        run: python preparation/.github/scripts/mvp_request_set.py --source upstream-fixed --data mvp-output --out mvp-candidates --universe "$MVP_UNIVERSE"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mvp-free-${{ github.run_id }}
          retention-days: 14
          path: |
            mvp-output/**/*.json
            mvp-output/**/*.csv
            mvp-output/**/*.md
            mvp-output/**/*.html
            mvp-output/**/*.txt
            mvp-output/**/*.log
            mvp-candidates/
      - name: State success independently of preserved failure artifacts
        env:
          MVP_UNIVERSE: ${{ inputs.mvp_universe }}
        run: |
          python - <<'PY'
          import json,pathlib,os
          rows=json.loads(pathlib.Path('mvp-output/RESULTS.json').read_text())['symbols']
          assert len(rows)==(35 if os.environ['MVP_UNIVERSE']=='watchlist35' else 3) and all(x['status']=='success_simulated_model' for x in rows), 'Partial failure: inspect per-symbol evidence; do not retry automatically'
          PY
  mvp_live:
    if: ${{ inputs.mvp_universe != 'single_mode_watchlist' && !inputs.comparison_modes && (inputs.execute_live && inputs.mvp_three && github.actor == github.repository_owner && github.ref == 'refs/heads/deploy/phase2h-request-preparation') }}
    permissions:
      contents: write
      actions: read
    environment: nvda-one-call-approval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      CUSTOM_TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      MVP_UNIVERSE: ${{ inputs.mvp_universe }}
      MVP_BUNDLE: ${{ inputs.mvp_universe == 'watchlist35' && 'preparation/.github/frozen/mvp-watchlist-v2' || 'preparation/.github/frozen/mvp-three-v3' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: preparation
      - uses: actions/checkout@v5
        with:
          ref: 68b85e7a143be95f5f7d4bea66989c37f777877a
          persist-credentials: false
          path: upstream-fixed
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Dependencies without model credentials
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python -m pip install -r upstream-fixed/requirements.txt litellm==1.98.1 httpx==0.28.1 openai==2.54.0 tiktoken==0.11.0 pandas==3.0.6 markdown2
          python preparation/.github/scripts/prepare_offline_assets.py --cache "$TIKTOKEN_CACHE_DIR"
      - name: Bind a separately approved frozen batch, never regenerate data
        env:
          BATCH_SHA: ${{ inputs.request_sha256 }}
          APPROVAL_REF: ${{ inputs.authorization_reference }}
          SECRET_APPROVAL_REF: ${{ inputs.secret_upload_approval_reference }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          if os.environ['GITHUB_RUN_ATTEMPT']!='1':raise SystemExit('rerun_forbidden')
          expected=(pathlib.Path(os.environ['MVP_BUNDLE'])/'REQUEST_SET_SHA256.txt').read_text().strip()
          raw=(pathlib.Path(os.environ['MVP_BUNDLE'])/'REQUEST_SET_LOCK.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['BATCH_SHA']==expected
          import sys
          sys.path.insert(0,str(pathlib.Path('preparation/.github/scripts').resolve()))
          from mvp_three_live import load_set,batch_spec
          lock,_,_=load_set(pathlib.Path(os.environ['MVP_BUNDLE']),expected)
          assert lock['profile']=='mvp_manual_v2' and not lock.get('offline_only')
          _,symbols,cap,reserve=batch_spec(lock)
          if os.environ['MVP_UNIVERSE']=='three':assert symbols==['NVDA','MU','QQQ']
          assert expected in os.environ['APPROVAL_REF'] and os.environ['SECRET_APPROVAL_REF'].strip()
          auth={'authorize_paid_posts':True,'batch_sha256':expected,'run_id':os.environ['GITHUB_RUN_ID'],'max_total_POSTs':cap,'reservation_USD':reserve,'authorization_reference':os.environ['APPROVAL_REF'],'secret_upload_approval_reference':os.environ['SECRET_APPROVAL_REF']}
          pathlib.Path('approved-batch.json').write_text(json.dumps(auth))
          PY
      - name: At most the explicitly approved manual batch, no retries
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BATCH_SHA: ${{ inputs.request_sha256 }}
        run: python preparation/.github/scripts/mvp_three_live.py --source upstream-fixed --bundle "$MVP_BUNDLE" --out real-research --batch-sha "$BATCH_SHA" --execute-authorized --authorization approved-batch.json
      - name: Credential scan before artifacts
        if: always()
        id: real_scan
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import os,pathlib
          key=os.environ.get('DEEPSEEK_API_KEY','').encode();root=pathlib.Path('real-research')
          if not key or not root.is_dir():raise SystemExit('no_safe_artifact')
          for p in root.rglob('*'):
              if p.is_file() and key in p.read_bytes():raise SystemExit('credential_found_do_not_upload')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('safe=true\n')
          PY
      - uses: actions/upload-artifact@v6
        if: ${{ always() && steps.real_scan.outputs.safe == 'true' }}
        with:
          name: real-manual-research-${{ github.run_id }}
          path: |
            real-research/**/*.json
            real-research/**/*.md
            real-research/**/*.html
            real-research/**/*.bin
            real-research/**/*.txt
            real-research/**/*.log
          retention-days: 14
  once:
    if: ${{ !inputs.comparison_modes && (inputs.execute_live && !inputs.mvp_three && github.actor == github.repository_owner && github.ref == 'refs/heads/deploy/phase2h-request-preparation') }}
    environment: nvda-one-call-approval
    runs-on: ubuntu-latest
    env:
      CUSTOM_TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 9e94ecc305e724a7c436c62e7e501e64c359991e
          persist-credentials: false
          path: controller
      - uses: actions/checkout@v5
        with:
          ref: a1daaa302b3a72fb5694c9872ceecf2c4dc0b6e4
          persist-credentials: false
          path: upstream-fixed
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Dependencies and offline tests (no key)
        env:
          DSA_FIXED_SOURCE: upstream-fixed
          PYTHONPATH: upstream-fixed
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: |
          python -m pip install -r upstream-fixed/requirements.txt litellm==1.98.1 httpx==0.28.1 openai==2.54.0 tiktoken==0.11.0 pandas==3.0.6
          python -m pip install pytest
          python -m pip check
          python controller/.github/scripts/prepare_offline_assets.py --cache "$TIKTOKEN_CACHE_DIR"
          python -m pytest controller/.github/scripts/test_phase2s_once.py -k 'peak or parameter_mutation or prompt_mutation or expired or timeout' -q
      - name: Read committed frozen Phase 2R files without regenerating
        run: cp -R controller/.github/frozen/phase2r locked-evidence
      - name: Bind the separately approved request to this run
        env:
          ALLOW_PEAK_TEST: ${{ inputs.allow_peak_test }}
          REQUEST_SHA: ${{ inputs.request_sha256 }}
          SNAPSHOT_ASOF: ${{ inputs.analysis_asof }}
          TARGET_SESSION: ${{ inputs.target_session }}
          PRICING_SHA: ${{ inputs.pricing_sha256 }}
          APPROVAL_REF: ${{ inputs.authorization_reference }}
          SECRET_APPROVAL_REF: ${{ inputs.secret_upload_approval_reference }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          if os.environ['GITHUB_RUN_ATTEMPT']!='1':raise SystemExit('rerun_forbidden')
          import hashlib,subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd='controller',text=True).strip()=='9e94ecc305e724a7c436c62e7e501e64c359991e'
          assert os.environ['REQUEST_SHA']=='08b09a31d1d08c4b1fa33bc92f850feb63709ace5c6f8fd43a63aa9bee82cdee'
          assert os.environ['SNAPSHOT_ASOF']=='2026-10-16T06:04:29.560325+00:00'
          assert os.environ['TARGET_SESSION']=='2026-10-15'
          assert os.environ['PRICING_SHA']=='210f102275ccf1a6542f08a3bc9e4b4c7c83278cb74b35217bffa112df6363b2'
          assert os.environ['REQUEST_SHA'] in os.environ['APPROVAL_REF'] and os.environ['SECRET_APPROVAL_REF'].strip()
          # Verify committed frozen files and metadata; no fetch/prompt rebuild.
          base=pathlib.Path('locked-evidence').resolve()
          assert hashlib.sha256((base/'MANIFEST.json').read_bytes()).hexdigest()=='ff2c035bcabe0bd347f5f7cc5885737039481d42fa30028a43e11c8916b366d7'
          for entry in json.loads((base/'MANIFEST.json').read_text(encoding='utf-8')):
              path=(base/entry['path']).resolve()
              assert path.is_relative_to(base)
              raw=path.read_bytes()
              assert len(raw)==entry['bytes'] and hashlib.sha256(raw).hexdigest()==entry['sha256']
          packet=json.loads(pathlib.Path('locked-evidence/ORIGINAL_REQUEST_PACKET.json').read_text(encoding='utf-8'))
          assert hashlib.sha256(json.dumps(packet,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()==os.environ['REQUEST_SHA']
          assert packet['model']=='deepseek-flash' and packet['thinking']=={'type':'disabled'}
          assert packet['max_tokens']==16384 and packet['stream'] is True
          assert packet['stream_options']=={'include_usage':True}
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd='upstream-fixed',text=True).strip()=='a1daaa302b3a72fb5694c9872ceecf2c4dc0b6e4'
          sys_path=pathlib.Path('upstream-fixed').resolve()
          import sys
          sys.path.insert(0,str(sys_path))
          from src.core.trading_calendar import get_effective_trading_date,_XCALS_AVAILABLE
          now=datetime.datetime.now(datetime.timezone.utc)
          snapshot=datetime.datetime.fromisoformat(os.environ['SNAPSHOT_ASOF'])
          material_expiry=min(snapshot+datetime.timedelta(hours=24),datetime.datetime.fromisoformat('2026-10-16T20:00:00+00:00'))
          lock=json.loads((base/'REQUEST_LOCK.json').read_text(encoding='utf-8'))
          assert lock['request_sha256']==os.environ['REQUEST_SHA'] and lock['authorize_paid_POST'] is False
          assert datetime.datetime.fromisoformat(lock['expires_at'])==material_expiry
          if now>=material_expiry:raise SystemExit('EXPIRED_no_POST_no_refresh')
          allow_peak_test=os.environ.get('ALLOW_PEAK_TEST')=='true'
          if allow_peak_test and 'Phase2U' not in os.environ['APPROVAL_REF']:raise SystemExit('phase2u_explicit_test_approval_required')
          if now.weekday()<5 and (1<=now.hour<4 or 6<=now.hour<10) and not allow_peak_test:raise SystemExit('peak_window_no_POST')
          assert _XCALS_AVAILABLE and get_effective_trading_date('us',current_time=now).isoformat()==os.environ['TARGET_SESSION']
          # Shorter per-run authorization; never extend the frozen material window.
          execution_expiry=min(now+datetime.timedelta(minutes=15),material_expiry-datetime.timedelta(seconds=30))
          if now>=execution_expiry:raise SystemExit('too_close_to_material_expiry_no_POST')
          data={'allow_peak_test':allow_peak_test,'authorize_paid_post':True,'authorization_reference':os.environ['APPROVAL_REF'],'secret_upload_approval_reference':os.environ['SECRET_APPROVAL_REF'],'run_id':os.environ['GITHUB_RUN_ID'],'fixed_commit':'a1daaa302b3a72fb5694c9872ceecf2c4dc0b6e4','target_session':os.environ['TARGET_SESSION'],'request_sha256':os.environ['REQUEST_SHA'],'analysis_asof':os.environ['SNAPSHOT_ASOF'],'pricing_sha256':os.environ['PRICING_SHA'],'reservation_usd':'0.03','expires_at':execution_expiry.isoformat()}
          pathlib.Path('approved-request.json').write_text(json.dumps(data),encoding='utf-8')
          PY
      - name: One authorized native call, no retry
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          PYTHONIOENCODING: utf-8
        run: python controller/.github/scripts/nvda_frozen_once.py --source upstream-fixed --bundle locked-evidence --out authorized-evidence --execute-authorized --authorization approved-request.json --run-id "$GITHUB_RUN_ID"
      - name: Block artifact upload if credential is found
        if: always()
        id: scan
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import os,pathlib,gzip
          key=os.environ.get('DEEPSEEK_API_KEY','').encode()
          root=pathlib.Path('authorized-evidence')
          if not key or not root.is_dir():raise SystemExit('no_safe_artifact')
          for p in root.rglob('*'):
              if not p.is_file():continue
              raw=p.read_bytes()
              if key in raw:raise SystemExit('credential_scan_failed_no_upload')
              if raw.startswith(b'\x1f\x8b') and key in gzip.decompress(raw):raise SystemExit('compressed_credential_scan_failed_no_upload')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:f.write('safe=true\n')
          PY
      - uses: actions/upload-artifact@v6
        if: ${{ always() && steps.scan.outputs.safe == 'true' }}
        with:
          name: authorized-nvda-${{ github.run_id }}
          path: authorized-evidence/
          retention-days: 7


  paired_free:
    if: ${{ inputs.comparison_modes && !inputs.execute_live && github.actor == github.repository_owner && github.ref == 'refs/heads/deploy/phase2h-request-preparation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      MVP_BUNDLE: preparation/.github/frozen/mode-comparison-v1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: preparation
      - uses: actions/checkout@v5
        with:
          ref: 577624ad8459871630c690e5760ae504ac6f2b9f
          persist-credentials: false
          path: upstream-fixed
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Original dependencies, no model credentials
        run: |
          python -m pip install -r upstream-fixed/requirements.txt litellm==1.98.1 httpx==0.28.1 openai==2.54.0 tiktoken==0.11.0 pandas==3.0.6 pytest
          python -m pip check
      - name: Only paired entry compatibility, no real key or model network
        env:
          DSA_FIXED_SOURCE: ${{ github.workspace }}/upstream-fixed
          PAIR_SHA: ${{ inputs.request_sha256 }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PAIR_SHA" = 3dde3f5041d57b51cd8f5dfa043069bfd5e12d3827ac86773af9eb676d6cf843
          python -m pytest preparation/.github/scripts/test_comparison_entry.py preparation/.github/scripts/test_mode_comparison.py preparation/.github/scripts/test_nvda_frozen_once.py -q
          python preparation/.github/scripts/mvp_three_live.py --source upstream-fixed --bundle "$MVP_BUNDLE" --out paired-free --batch-sha "$PAIR_SHA" --simulate
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: paired-free-${{ github.run_id }}
          path: paired-free/
          retention-days: 14

  paired_live:
    if: ${{ inputs.comparison_modes && inputs.execute_live && github.actor == github.repository_owner && github.ref == 'refs/heads/deploy/phase2h-request-preparation' }}
    permissions:
      contents: write
      actions: read
    environment: nvda-one-call-approval
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      MVP_BUNDLE: preparation/.github/frozen/mode-comparison-v1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: preparation
      - uses: actions/checkout@v5
        with:
          ref: 577624ad8459871630c690e5760ae504ac6f2b9f
          persist-credentials: false
          path: upstream-fixed
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Original dependencies, no model credentials
        run: |
          python -m pip install -r upstream-fixed/requirements.txt litellm==1.98.1 httpx==0.28.1 openai==2.54.0 tiktoken==0.11.0 pandas==3.0.6 pytest
          python -m pip check
      - name: Bind the explicitly approved six-request batch (never regenerate)
        env:
          BATCH_SHA: ${{ inputs.request_sha256 }}
          APPROVAL_REF: ${{ inputs.authorization_reference }}
          SECRET_APPROVAL_REF: ${{ inputs.secret_upload_approval_reference }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,sys,subprocess
          if os.environ['GITHUB_RUN_ATTEMPT']!='1':raise SystemExit('rerun_forbidden')
          root=pathlib.Path(os.environ['MVP_BUNDLE'])
          expected='3dde3f5041d57b51cd8f5dfa043069bfd5e12d3827ac86773af9eb676d6cf843'
          assert os.environ['BATCH_SHA']==expected==hashlib.sha256((root/'COMPARISON_LOCK.json').read_bytes()).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd='preparation',text=True).strip()==os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd='upstream-fixed',text=True).strip()=='577624ad8459871630c690e5760ae504ac6f2b9f'
          sys.path.insert(0,str(pathlib.Path('preparation/.github/scripts').resolve()))
          from mvp_three_live import load_set,batch_spec
          lock,_,_=load_set(root,expected);business,slots,cap,reserve=batch_spec(lock)
          assert cap==6 and reserve=='0.27' and expected in os.environ['APPROVAL_REF'] and os.environ['SECRET_APPROVAL_REF'].strip()
          auth={'authorize_paid_posts':True,'batch_sha256':expected,'run_id':os.environ['GITHUB_RUN_ID'],'max_total_POSTs':cap,'reservation_USD':reserve,'authorization_reference':os.environ['APPROVAL_REF'],'secret_upload_approval_reference':os.environ['SECRET_APPROVAL_REF']}
          pathlib.Path('approved-comparison.json').write_text(json.dumps(auth),encoding='utf-8')
          PY
      - name: Authorized six slots only, zero retries (key only here)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BATCH_SHA: ${{ inputs.request_sha256 }}
        run: python preparation/.github/scripts/mvp_three_live.py --source upstream-fixed --bundle "$MVP_BUNDLE" --out paired-real --batch-sha "$BATCH_SHA" --execute-authorized --authorization approved-comparison.json
      - name: Credential scan before artifacts
        if: always()
        id: paired_scan
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import gzip,os,pathlib
          key=os.environ.get('DEEPSEEK_API_KEY','').encode();root=pathlib.Path('paired-real')
          if not key or not root.is_dir():raise SystemExit('no_safe_artifact')
          for p in root.rglob('*'):
              if p.is_file():
                  raw=p.read_bytes()
                  if key in raw or (raw.startswith(b'\x1f\x8b') and key in gzip.decompress(raw)):raise SystemExit('credential_found_do_not_upload')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('safe=true\n')
          PY
      - uses: actions/upload-artifact@v6
        if: ${{ always() && steps.paired_scan.outputs.safe == 'true' }}
        with:
          name: real-paired-research-${{ github.run_id }}
          path: paired-real/
          retention-days: 14
