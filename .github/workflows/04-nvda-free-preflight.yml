name: Manual authorized frozen NVDA Phase 2N one POST
on:
  workflow_dispatch:
    inputs:
      execute_live:
        type: boolean
        default: false
      request_sha256:
        type: string
        required: true
      analysis_asof:
        type: string
        required: true
      target_session:
        type: string
        required: true
      pricing_sha256:
        type: string
        required: true
      authorization_reference:
        type: string
        required: true
      secret_upload_approval_reference:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: nvda-manual-preflight
  cancel-in-progress: false
jobs:
  once:
    if: ${{ inputs.execute_live && github.actor == github.repository_owner && github.ref == 'refs/heads/deploy/phase2h-request-preparation' }}
    environment: nvda-one-call-approval
    runs-on: ubuntu-latest
    env:
      CUSTOM_TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: adeb8cc9759217b306e1b0ea74369790c5684025
          persist-credentials: false
          path: controller
      - uses: actions/checkout@v5
        with:
          ref: f93a7609e569e3b6c6372e652a3d36a27225d783
          persist-credentials: false
          path: upstream-fixed
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Dependencies and offline tests (no key)
        env:
          DSA_FIXED_SOURCE: upstream-fixed
          PYTHONPATH: upstream-fixed
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: |
          python -m pip install -r upstream-fixed/requirements.txt litellm==1.98.1 httpx==0.28.1 openai==2.54.0 tiktoken==0.11.0 pandas==3.0.6
          python -m pip install pytest
          python -m pip check
          python controller/.github/scripts/prepare_offline_assets.py --cache "$TIKTOKEN_CACHE_DIR"
          python controller/.github/scripts/phase2g_offline_tests.py
          python controller/.github/scripts/phase2g_upstream_regression.py
      - uses: actions/download-artifact@v5
        with:
          name: phase2m-request-38748119384
          run-id: 38748119384
          github-token: ${{ github.token }}
          path: locked-evidence
      - name: Bind the separately approved request to this run
        env:
          REQUEST_SHA: ${{ inputs.request_sha256 }}
          SNAPSHOT_ASOF: ${{ inputs.analysis_asof }}
          TARGET_SESSION: ${{ inputs.target_session }}
          PRICING_SHA: ${{ inputs.pricing_sha256 }}
          APPROVAL_REF: ${{ inputs.authorization_reference }}
          SECRET_APPROVAL_REF: ${{ inputs.secret_upload_approval_reference }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          if os.environ['GITHUB_RUN_ATTEMPT']!='1':raise SystemExit('rerun_forbidden')
          import hashlib,subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd='controller',text=True).strip()=='adeb8cc9759217b306e1b0ea74369790c5684025'
          assert os.environ['REQUEST_SHA']=='13c38395630faeef2a638e10dcf5966396c7cbf40d26110045f3b47712a06ccd'
          assert os.environ['SNAPSHOT_ASOF']=='2026-10-15T14:05:23.935154+00:00'
          assert os.environ['TARGET_SESSION']=='2026-10-14'
          assert os.environ['PRICING_SHA']=='210f102275ccf1a6542f08a3bc9e4b4c7c83278cb74b35217bffa112df6363b2'
          assert os.environ['APPROVAL_REF'].strip() and os.environ['SECRET_APPROVAL_REF'].strip()
          # Verify immutable Runner files before reading the request; no fetch/prompt rebuild.
          base=pathlib.Path('locked-evidence').resolve()
          assert hashlib.sha256((base/'MANIFEST.json').read_bytes()).hexdigest()=='d6c2e8cb1f14d79bd676d68843e9831f657feb2cf6815522254088afb7af68fe'
          for entry in json.loads((base/'MANIFEST.json').read_text(encoding='utf-8')):
              path=(base/entry['path']).resolve()
              assert path.is_relative_to(base)
              raw=path.read_bytes()
              assert len(raw)==entry['bytes'] and hashlib.sha256(raw).hexdigest()==entry['sha256']
          packet=json.loads(pathlib.Path('locked-evidence/nvda-inputs/ORIGINAL_REQUEST_PACKET.json').read_text(encoding='utf-8'))
          assert hashlib.sha256(json.dumps(packet,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()==os.environ['REQUEST_SHA']
          assert packet['model']=='deepseek-flash' and packet['thinking']=={'type':'disabled'}
          assert packet['max_tokens']==8192 and packet['stream'] is True
          assert packet['stream_options']=={'include_usage':True}
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd='upstream-fixed',text=True).strip()=='f93a7609e569e3b6c6372e652a3d36a27225d783'
          sys_path=pathlib.Path('upstream-fixed').resolve()
          import sys
          sys.path.insert(0,str(sys_path))
          from src.core.trading_calendar import get_effective_trading_date,_XCALS_AVAILABLE
          now=datetime.datetime.now(datetime.timezone.utc)
          snapshot=datetime.datetime.fromisoformat(os.environ['SNAPSHOT_ASOF'])
          material_expiry=min(snapshot+datetime.timedelta(hours=24),datetime.datetime.fromisoformat('2026-10-15T20:00:00+00:00'))
          if now>=material_expiry:raise SystemExit('EXPIRED_no_POST_no_refresh')
          assert _XCALS_AVAILABLE and get_effective_trading_date('us',current_time=now).isoformat()==os.environ['TARGET_SESSION']
          # Shorter per-run authorization; never extend the frozen material window.
          execution_expiry=min(now+datetime.timedelta(minutes=15),material_expiry-datetime.timedelta(seconds=30))
          if now>=execution_expiry:raise SystemExit('too_close_to_material_expiry_no_POST')
          data={'authorize_paid_post':True,'authorization_reference':os.environ['APPROVAL_REF'],'secret_upload_approval_reference':os.environ['SECRET_APPROVAL_REF'],'run_id':os.environ['GITHUB_RUN_ID'],'fixed_commit':'f93a7609e569e3b6c6372e652a3d36a27225d783','target_session':os.environ['TARGET_SESSION'],'request_sha256':os.environ['REQUEST_SHA'],'analysis_asof':os.environ['SNAPSHOT_ASOF'],'pricing_sha256':os.environ['PRICING_SHA'],'reservation_usd':'0.03','expires_at':execution_expiry.isoformat()}
          pathlib.Path('approved-request.json').write_text(json.dumps(data),encoding='utf-8')
          PY
      - name: One authorized native call, no retry
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          PYTHONIOENCODING: utf-8
        run: python controller/.github/scripts/nvda_frozen_once.py --source upstream-fixed --bundle locked-evidence/nvda-inputs --out authorized-evidence --execute-authorized --authorization approved-request.json --run-id "$GITHUB_RUN_ID"
      - name: Block artifact upload if credential is found
        if: always()
        id: scan
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import os,pathlib,gzip
          key=os.environ.get('DEEPSEEK_API_KEY','').encode()
          root=pathlib.Path('authorized-evidence')
          if not key or not root.is_dir():raise SystemExit('no_safe_artifact')
          for p in root.rglob('*'):
              if not p.is_file():continue
              raw=p.read_bytes()
              if key in raw:raise SystemExit('credential_scan_failed_no_upload')
              if raw.startswith(b'\x1f\x8b') and key in gzip.decompress(raw):raise SystemExit('compressed_credential_scan_failed_no_upload')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:f.write('safe=true\n')
          PY
      - uses: actions/upload-artifact@v6
        if: ${{ always() && steps.scan.outputs.safe == 'true' }}
        with:
          name: authorized-nvda-${{ github.run_id }}
          path: authorized-evidence/
          retention-days: 7

