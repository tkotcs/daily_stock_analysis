name: Manual authorized NVDA one POST
on:
  workflow_dispatch:
    inputs:
      execute_live:
        type: boolean
        default: false
      request_sha256:
        type: string
        required: true
      analysis_asof:
        type: string
        required: true
      target_session:
        type: string
        required: true
      pricing_sha256:
        type: string
        required: true
      authorization_reference:
        type: string
        required: true
      secret_upload_approval_reference:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: nvda-manual-preflight
  cancel-in-progress: false
jobs:
  once:
    if: ${{ inputs.execute_live && github.actor == github.repository_owner }}
    environment: nvda-one-call-approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: controller
      - uses: actions/checkout@v5
        with:
          ref: 2b896241f69d0177c2b6f298cf69042b8531dd76
          persist-credentials: false
          path: upstream-fixed
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Dependencies and offline tests (no key)
        env:
          DSA_FIXED_SOURCE: upstream-fixed
          PYTHONPATH: upstream-fixed
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: |
          python -m pip install -r upstream-fixed/requirements.txt
          python -m pip install litellm==1.105.1 httpx==0.28.1 tiktoken==0.11.0
          python controller/.github/scripts/test_nvda_frozen_once.py
          python controller/.github/scripts/test_deepseek_post_guard.py
          python controller/.github/scripts/test_authorized_once.py
      - uses: actions/download-artifact@v5
        with:
          name: nvda-free-preflight-38688465193
          run-id: 38688465193
          github-token: ${{ github.token }}
          path: locked-evidence
      - name: Bind the separately approved request to this run
        env:
          REQUEST_SHA: ${{ inputs.request_sha256 }}
          SNAPSHOT_ASOF: ${{ inputs.analysis_asof }}
          TARGET_SESSION: ${{ inputs.target_session }}
          PRICING_SHA: ${{ inputs.pricing_sha256 }}
          APPROVAL_REF: ${{ inputs.authorization_reference }}
          SECRET_APPROVAL_REF: ${{ inputs.secret_upload_approval_reference }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          if os.environ['GITHUB_RUN_ATTEMPT']!='1':raise SystemExit('rerun_forbidden')
          now=datetime.datetime.now(datetime.timezone.utc)
          data={'authorize_paid_post':True,'authorization_reference':os.environ['APPROVAL_REF'],'secret_upload_approval_reference':os.environ['SECRET_APPROVAL_REF'],'run_id':os.environ['GITHUB_RUN_ID'],'fixed_commit':'2b896241f69d0177c2b6f298cf69042b8531dd76','target_session':os.environ['TARGET_SESSION'],'request_sha256':os.environ['REQUEST_SHA'],'analysis_asof':os.environ['SNAPSHOT_ASOF'],'pricing_sha256':os.environ['PRICING_SHA'],'reservation_usd':'0.03','expires_at':(now+datetime.timedelta(minutes=15)).isoformat()}
          pathlib.Path('approved-request.json').write_text(json.dumps(data),encoding='utf-8')
          PY
      - name: One authorized native call, no retry
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          PYTHONIOENCODING: utf-8
        run: python controller/.github/scripts/nvda_frozen_once.py --source upstream-fixed --bundle locked-evidence/nvda-evidence --out authorized-evidence --execute-authorized --authorization approved-request.json --run-id "$GITHUB_RUN_ID"
      - name: Block artifact upload if credential is found
        if: always()
        id: scan
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import os,pathlib
          key=os.environ.get('DEEPSEEK_API_KEY','').encode()
          root=pathlib.Path('authorized-evidence')
          if not key or not root.is_dir():raise SystemExit('no_safe_artifact')
          if any(key in p.read_bytes() for p in root.rglob('*') if p.is_file()):raise SystemExit('credential_scan_failed_no_upload')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:f.write('safe=true\n')
          PY
      - uses: actions/upload-artifact@v6
        if: ${{ always() && steps.scan.outputs.safe == 'true' }}
        with:
          name: authorized-nvda-${{ github.run_id }}
          path: authorized-evidence/
          retention-days: 7

