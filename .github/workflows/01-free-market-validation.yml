name: Manual Phase 2J free integration acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: phase2j-free-integration
  cancel-in-progress: false
jobs:
  free-acceptance:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      CUSTOM_TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify manual first attempt and source identity
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e .env
          mkdir -p phase2j-evidence/tests
          git rev-parse HEAD > phase2j-evidence/COMMIT.txt
          cp .github/workflows/01-free-market-validation.yml phase2j-evidence/ACTUAL_WORKFLOW.yml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Full native dependencies and public offline tokenizer
        run: |
          python -m pip install -r requirements.txt litellm==1.98.1 httpx==0.28.1 openai==2.54.0 tiktoken==0.11.0 pandas==3.0.6 pytest
          python -m pip check
          python -m pip freeze > phase2j-evidence/DEPENDENCIES.txt
          python .github/scripts/prepare_offline_assets.py --cache "$TIKTOKEN_CACHE_DIR" > phase2j-evidence/TOKENIZER_ASSETS.json
      - uses: actions/download-artifact@v5
        with:
          name: authorized-nvda-38693407248
          run-id: 38693407248
          github-token: ${{ github.token }}
          path: historical-2e
      - uses: actions/download-artifact@v5
        with:
          name: authorized-nvda-38706973098
          run-id: 38706973098
          github-token: ${{ github.token }}
          path: historical-2h
      - uses: actions/download-artifact@v5
        with:
          name: phase2h-request-38704910265
          run-id: 38704910265
          github-token: ${{ github.token }}
          path: historical-inputs
      - name: Free-only outbound guard fault injection
        run: python .github/scripts/phase2j_guard_selftest.py > phase2j-evidence/GUARD_CONTROL_TEST.json
      - name: Offline native regressions and one-POST fault injection - no credentials
        run: |
          set -o pipefail
          python .github/scripts/phase2j_offline_tests.py . "$TIKTOKEN_CACHE_DIR" phase2j-evidence/tests 2>&1 | tee phase2j-evidence/OFFLINE_TESTS.log
      - name: Replay immutable real responses without model or SMTP
        run: |
          set -o pipefail
          python .github/scripts/phase2j_replay.py --phase2e historical-2e --phase2h historical-2h --inputs historical-inputs/nvda-inputs --out phase2j-evidence/replay 2>&1 | tee phase2j-evidence/REPLAY.log
      - name: Free live Yahoo GETs only - no model keys or mail
        run: |
          set -o pipefail
          python .github/scripts/phase2j_free_guard.py --out phase2j-evidence/free-data 2>&1 | tee phase2j-evidence/FREE_DATA.log
      - name: Classify financial gaps and verify 35 native MA60 calculations offline
        run: |
          set -o pipefail
          python .github/scripts/phase2j_data_review.py --data phase2j-evidence/free-data --out phase2j-evidence/data-review 2>&1 | tee phase2j-evidence/DATA_REVIEW.log
      - name: Seal evidence hashes
        if: always()
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,datetime,os
          out=pathlib.Path('phase2j-evidence');out.mkdir(exist_ok=True)
          meta={'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'commit':os.environ['GITHUB_SHA'],'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'paid_credentials_injected':False,'model_POSTs_allowed':False,'SMTP_allowed':False}
          (out/'RUN_CONTEXT.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          files=[{'path':p.relative_to(out).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p.name!='MANIFEST.json']
          (out/'MANIFEST.json').write_text(json.dumps(files,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2j-free-${{ github.run_id }}
          path: phase2j-evidence/
          retention-days: 14
