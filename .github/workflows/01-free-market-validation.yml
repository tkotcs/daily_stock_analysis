name: Manual native market capture - zero paid POST
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Start with NVDA; watchlist35 only after source access is verified"
        type: choice
        options: [nvda, watchlist35]
        default: nvda
permissions:
  contents: read
concurrency:
  group: free-native-market-capture
  cancel-in-progress: false
jobs:
  capture:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      CUSTOM_TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      RESEARCH_API_BASE: ${{ vars.RESEARCH_API_BASE }}
      CAPTURE_SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 577624ad8459871630c690e5760ae504ac6f2b9f
          path: upstream-fixed
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install native dependencies and public tokenizer
        run: |
          python -m pip install -r upstream-fixed/requirements.txt litellm==1.98.1 httpx==0.28.1 openai==2.54.0 tiktoken==0.11.0 pandas==3.0.6 markdown2 pytest
          python .github/scripts/prepare_offline_assets.py --cache "$TIKTOKEN_CACHE_DIR"
      - name: Deterministic refusal regression checks
        run: python -m pytest .github/scripts/test_mvp_capture_refusal.py -q --junitxml=refusal-tests.xml
      - name: Native capture without supplier or email credentials
        run: |
          if [ "$CAPTURE_SCOPE" = nvda ]; then
            python .github/scripts/mvp_three.py --source upstream-fixed --out capture --only NVDA
          elif [ "$CAPTURE_SCOPE" = watchlist35 ]; then
            python .github/scripts/daily_news.py --config .github/research/daily-news-feeds.json --out daily-news
            python .github/scripts/mvp_three.py --source upstream-fixed --out capture --universe watchlist35 --news-data daily-news/NEWS_PACKET.json
          else
            exit 1
          fi
      - name: Prepare a consolidated candidate only for the full watchlist
        if: inputs.scope == 'watchlist35'
        run: |
          python .github/scripts/daily_briefing.py gate --source upstream-fixed --out calendar.json
          python - <<'PY'
          import json,subprocess,sys
          session=json.load(open('calendar.json'))['completed_session']
          subprocess.run([sys.executable,'.github/scripts/daily_briefing.py','prepare',
              '--source','upstream-fixed','--data','capture',
              '--profile','.github/research/gpt-6.1-sol-review-profile.json',
              '--out','daily-ready','--session',session],check=True)
          PY
      - name: Summarize actual data coverage and fail if no valid market input
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          path=pathlib.Path('capture/RESULTS.json')
          result=json.loads(path.read_text()) if path.exists() else {'symbols':[]}
          rows=result['symbols']
          valid=sum(r['status']=='success_simulated_model' for r in rows)
          summary=dict(scope=os.environ['CAPTURE_SCOPE'],valid=valid,requested=len(rows),
              real_model_POSTs=result.get('real_POSTs',0),SMTP_attempts=result.get('mail_sent',0),
              no_supplier_or_email_secrets_injected=True,symbols=rows)
          pathlib.Path('FREE_CAPTURE_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Free native capture\n\n```json\n'+json.dumps(summary,ensure_ascii=False,indent=2)+'\n```\n')
          assert path.exists() and rows and valid>0,'no_valid_market_input_inspect_saved_evidence'
          assert result['real_POSTs']==0 and result['mail_sent']==0
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: free-native-${{ github.run_id }}
          retention-days: 14
          path: |
            FREE_CAPTURE_SUMMARY.json
            refusal-tests.xml
            calendar.json
            daily-ready/
            daily-news/CAPTURES.json
            daily-news/NEWS_PACKET.json
            capture/RESULTS.json
            capture/*/STATUS.json
            capture/*/HTTP_TRACE.json
            capture/*/ERROR.txt
            capture/*/DAILY.csv
            capture/*/NATIVE_CONTEXT.json
            capture/*/FINAL_REQUEST.json
            capture/*/FINANCIAL_AUDIT.json
            capture/*/PRICE_AUDIT.json
            capture/*/TECHNICAL.json
            capture/*/chart-*.json
