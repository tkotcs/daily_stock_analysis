name: Manual Phase 2K NVDA request capture - zero paid POST
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: phase2k-free-preflight
  cancel-in-progress: false
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      CUSTOM_TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: controller
      - uses: actions/checkout@v5
        with:
          ref: f93a7609e569e3b6c6372e652a3d36a27225d783
          persist-credentials: false
          path: upstream-fixed
      - name: Enforce first manual attempt and fixed business source
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C controller rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C upstream-fixed rev-parse HEAD)" = f93a7609e569e3b6c6372e652a3d36a27225d783
          test ! -e upstream-fixed/.env
          mkdir -p phase2k-evidence/tests
          git -C controller rev-parse HEAD > phase2k-evidence/CONTROLLER_COMMIT.txt
          git -C upstream-fixed rev-parse HEAD > phase2k-evidence/BUSINESS_COMMIT.txt
          cp controller/.github/workflows/01-free-market-validation.yml phase2k-evidence/ACTUAL_WORKFLOW.yml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: upstream-fixed/requirements.txt
      - name: Original full dependencies and public tokenizer
        run: |
          python -m pip install -r upstream-fixed/requirements.txt litellm==1.98.1 httpx==0.28.1 openai==2.54.0 tiktoken==0.11.0 pandas==3.0.6 pytest
          python -m pip check
          python -m pip freeze > phase2k-evidence/DEPENDENCIES.txt
          python controller/.github/scripts/prepare_offline_assets.py --cache "$TIKTOKEN_CACHE_DIR" > phase2k-evidence/TOKENIZER_ASSETS.json
      - name: Offline pin, one-POST and native regression tests - no real key
        run: |
          set -o pipefail
          python controller/.github/scripts/phase2j_offline_tests.py controller "$TIKTOKEN_CACHE_DIR" phase2k-evidence/tests 2>&1 | tee phase2k-evidence/OFFLINE_TESTS.log
      - name: Fresh NVDA quote, official IR/RSS and native SDK request interception
        run: |
          set -o pipefail
          python controller/.github/scripts/nvda_free_preflight.py --source upstream-fixed --out phase2k-evidence/nvda-inputs --include-free-research 2>&1 | tee phase2k-evidence/CAPTURE.log
      - name: Seal read-only preparation evidence
        if: always()
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,os,datetime
          out=pathlib.Path('phase2k-evidence');out.mkdir(exist_ok=True)
          (out/'RUN_CONTEXT.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'controller':os.environ['GITHUB_SHA'],'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'real_key_injected':False,'paid_POSTs_allowed':False,'email_allowed':False},indent=2),encoding='utf-8')
          files=[{'path':p.relative_to(out).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p.name!='MANIFEST.json']
          (out/'MANIFEST.json').write_text(json.dumps(files,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2k-request-${{ github.run_id }}
          path: phase2k-evidence/
          retention-days: 14
